<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/>
      <stop offset="100%" stop-color="#f7eedb"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- top-left brand label -->
  <text x="80" y="100" font-family="'Inter', Helvetica, sans-serif" font-size="18" letter-spacing="6" fill="#a68a3e" font-weight="600">THE QUIET FORCES</text>

  <!-- thin gold rule under brand -->
  <line x1="80" y1="120" x2="200" y2="120" stroke="#a68a3e" stroke-width="1" opacity="0.6"/>

  <!-- centered headline -->
  <text x="80" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#2b2a26" font-weight="400" letter-spacing="-2">Seventeen forces</text>
  <text x="80" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#2b2a26" font-weight="400" letter-spacing="-2"><tspan font-style="italic" fill="#a68a3e">shape</tspan> a life.</text>

  <!-- bottom italic subhead -->
  <text x="80" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5a5348">A four-book project on the psychological forces quietly running most lives.</text>

  <!-- bottom-right URL -->
  <text x="1120" y="580" font-family="'Inter', Helvetica, sans-serif" font-size="14" fill="#8a8272" text-anchor="end" letter-spacing="2">helloonegirl.github.io/thequietforces</text>
</svg>
